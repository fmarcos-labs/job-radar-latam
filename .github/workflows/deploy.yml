name: Deploy
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: [self-hosted, mac-mini]
    env:
      PATH: /opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4
      - name: Validate local files
        run: |
          [ -f "/Users/freddymhs/apps/job-radar-latam/.env" ] || { echo "ERROR: .env not found"; exit 1; }
          [ -f "/Users/freddymhs/apps/job-radar-latam/run.sh" ] || { echo "ERROR: run.sh not found"; exit 1; }
          [ -f "/Library/LaunchDaemons/com.jobradar.latam.plist" ] \
            && echo "OK: LaunchDaemon com.jobradar.latam.plist presente" \
            || echo "WARN: LaunchDaemon /Library/LaunchDaemons/com.jobradar.latam.plist no encontrado. El scheduler no va a correr hasta que exista; no bloqueamos el deploy."
          echo "OK: .env y run.sh presentes"
      - name: Sync code to app directory
        run: rsync -a --delete --exclude='.env' --exclude='run.sh' --exclude='cron.log' --exclude='job1/20*' --exclude='job1/seen.json' --exclude='job1/clicks.json' --exclude='GIT_SHA' $GITHUB_WORKSPACE/ /Users/freddymhs/apps/job-radar-latam/
      - name: Update dependencies
        run: cd /Users/freddymhs/apps/job-radar-latam && /opt/homebrew/bin/pipenv install
      - name: Record deployed commit
        run: git -C $GITHUB_WORKSPACE rev-parse --short HEAD > /Users/freddymhs/apps/job-radar-latam/GIT_SHA
